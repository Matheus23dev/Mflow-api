services:
  - type: web
    name: mflow-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:deploy
    healthCheckPath: /api
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
