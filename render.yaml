services:
  - type: web
    name: mflow-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:deploy
    healthCheckPath: /api
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: FRONTEND_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: DISCORD_RECEIPTS_WEBHOOK_URL
        sync: false
      - key: RECEIPTS_WARNING_BYTES
        value: "8000000000"
      - key: RECEIPTS_CRITICAL_BYTES
        value: "8500000000"
      - key: RECEIPTS_HARD_LIMIT_BYTES
        value: "9000000000"
      - key: RECEIPT_SIGNED_URL_TTL_SECONDS
        value: "60"
      - key: DATABASE_WARNING_BYTES
        value: "350000000"
      - key: DATABASE_CRITICAL_BYTES
        value: "425000000"
      - key: DATABASE_DANGER_BYTES
        value: "475000000"
